<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Calculadora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculadora">

      <div class="display">
        <p class="display__expression" id="expression"></p>
        <output class="display__result" id="result" aria-live="polite" aria-atomic="true">0</output>
      </div>

      <div class="keypad" id="keypad">
        <button class="key key--function" data-action="clear" data-key="Escape" aria-label="Limpar tudo">AC</button>
        <button class="key key--function" data-action="delete" data-key="Backspace" aria-label="Apagar último dígito">DEL</button>
        <button class="key key--function" data-action="percent" data-key="%" aria-label="Porcentagem">%</button>
        <button class="key key--operator" data-action="operator" data-value="divide" data-key="/" aria-label="Dividir">÷</button>

        <button class="key" data-action="digit" data-value="7" data-key="7">7</button>
        <button class="key" data-action="digit" data-value="8" data-key="8">8</button>
        <button class="key" data-action="digit" data-value="9" data-key="9">9</button>
        <button class="key key--operator" data-action="operator" data-value="multiply" data-key="*" aria-label="Multiplicar">×</button>

        <button class="key" data-action="digit" data-value="4" data-key="4">4</button>
        <button class="key" data-action="digit" data-value="5" data-key="5">5</button>
        <button class="key" data-action="digit" data-value="6" data-key="6">6</button>
        <button class="key key--operator" data-action="operator" data-value="subtract" data-key="-" aria-label="Subtrair">−</button>

        <button class="key" data-action="digit" data-value="1" data-key="1">1</button>
        <button class="key" data-action="digit" data-value="2" data-key="2">2</button>
        <button class="key" data-action="digit" data-value="3" data-key="3">3</button>
        <button class="key key--operator" data-action="operator" data-value="add" data-key="+" aria-label="Somar">+</button>

        <button class="key key--function" data-action="sign" aria-label="Alternar entre positivo e negativo">±</button>
        <button class="key" data-action="digit" data-value="0" data-key="0">0</button>
        <button class="key" data-action="decimal" data-key="." aria-label="Vírgula decimal">,</button>
        <button class="key key--equals" data-action="equals" data-key="Enter" aria-label="Calcular resultado">=</button>
      </div>

    </section>
  </main>
</body>
</html>
